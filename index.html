<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeRush | Healthcare Routing Engine</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
body{margin:0;overflow:hidden;background:#020617;color:#f8fafc;font-family:ui-sans-serif,system-ui,sans-serif}
.glass-panel{background:rgba(15,23,42,.65);backdrop-filter:blur(20px);border-left:1px solid rgba(255,255,255,.05)}
.card-glass{background:rgba(30,41,59,.5);border:1px solid rgba(255,255,255,.05);border-radius:.75rem}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:rgba(15,23,42,.5)}::-webkit-scrollbar-thumb{background:rgba(71,85,105,.8);border-radius:10px}
.leaflet-container{background:#020617}.leaflet-popup-content-wrapper{background:rgba(15,23,42,.9);color:white;border:1px solid #334155;backdrop-filter:blur(10px)}.leaflet-popup-tip{background:rgba(15,23,42,.9)}
.route-glow{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawLine 2s ease-out forwards;filter:drop-shadow(0 0 6px #06b6d4)}@keyframes drawLine{to{stroke-dashoffset:0}}
.btn-trigger{transition:all .3s ease;box-shadow:0 0 15px rgba(6,182,212,.2)}.btn-trigger:hover{box-shadow:0 0 25px rgba(6,182,212,.6);transform:translateY(-1px)}
</style>
</head>
<body class="flex h-screen w-screen">
<div id="map" class="w-[70%] h-full relative z-0"></div>
<div class="glass-panel w-[30%] h-full z-10 flex flex-col p-6 shadow-2xl relative">
<div class="mb-6 gs-header"><h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent tracking-tight">CodeRush Engine</h1><p class="text-xs text-slate-400 mt-1 uppercase tracking-widest font-semibold">Live Routing Telemetry</p></div>
<div class="card-glass p-4 mb-6 gs-controls"><label class="block text-xs text-slate-400 mb-2 uppercase tracking-wide">Emergency Trigger</label><div class="flex gap-2"><select id="specialty-select" class="bg-slate-900 border border-slate-700 text-sm rounded-lg block w-full p-2.5 outline-none"><option>Cardiology</option><option>Trauma</option><option>Neurology</option><option>Pediatrics</option></select><button id="btn-trigger" class="btn-trigger bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 px-4 rounded-lg text-sm w-32">DISPATCH</button></div></div>
<div class="mb-6 flex-1 flex flex-col min-h-[300px]"><h2 class="text-xs text-slate-400 mb-3 uppercase tracking-wide">Hospital Resources</h2><div id="telemetry-container" class="space-y-3 overflow-y-auto pr-2"></div></div>
<div class="flex-1 flex flex-col min-h-[250px] mt-auto"><h2 class="text-xs text-slate-400 mb-2 uppercase tracking-wide">Algorithmic Decision Log</h2><div id="decision-log" class="card-glass flex-1 p-3 overflow-y-auto font-mono text-xs text-slate-300 space-y-2"><div class="text-emerald-400">&gt; System initialized. Dijkstra engine online.</div><div class="text-slate-500">&gt; Awaiting emergency payload...</div></div></div>
</div>
<script>
const SPECIALTIES=["Cardiology","Trauma","Neurology","Pediatrics"],NODE_COUNT=500,HOSPITAL_COUNT=5,AMBULANCE_COUNT=10,LOW_BED_THRESHOLD=2,LOW_BED_WAIT_PENALTY=15;
class MinPriorityQueue{constructor(){this.heap=[]}isEmpty(){return this.heap.length===0}enqueue(value,priority){this.heap.push({value,priority});let i=this.heap.length-1;while(i>0){const p=Math.floor((i-1)/2);if(this.heap[p].priority<=this.heap[i].priority)break;[this.heap[p],this.heap[i]]=[this.heap[i],this.heap[p]];i=p}}dequeue(){if(!this.heap.length)return null;if(this.heap.length===1)return this.heap.pop();const min=this.heap[0];this.heap[0]=this.heap.pop();let i=0;while(1){const l=i*2+1,r=i*2+2;let s=i;if(l<this.heap.length&&this.heap[l].priority<this.heap[s].priority)s=l;if(r<this.heap.length&&this.heap[r].priority<this.heap[s].priority)s=r;if(s===i)break;[this.heap[i],this.heap[s]]=[this.heap[s],this.heap[i]];i=s}return min}}
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,rf=(a,b)=>Math.random()*(b-a)+a,riem=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generateMockGraph(){const graph=new Map(),nodes=[];for(let i=0;i<NODE_COUNT;i++){const n={id:`N-${i+1}`,coordinates:[rf(18.8,19.2),rf(72.7,73.3)],type:i<50?'VILLAGE':'INTERSECTION'};nodes.push(n);graph.set(n.id,[])}const edge=(a,b,t)=>{graph.get(a).push({to:b,travelTime:t,blocked:false});graph.get(b).push({to:a,travelTime:t,blocked:false})};for(let i=1;i<nodes.length;i++)edge(nodes[i].id,nodes[ri(0,i-1)].id,ri(3,30));for(let i=0;i<NODE_COUNT*2;i++){let a=riem(nodes),b=riem(nodes);if(a.id!==b.id)edge(a.id,b.id,ri(3,30))}const hospitals=[];for(const [i,n] of shuffle(nodes).slice(0,5).entries()){n.type='HOSPITAL';hospitals.push({id:`H-${i+1}`,nodeId:n.id,coordinates:[...n.coordinates],specialty:shuffle(SPECIALTIES).slice(0,ri(1,4)),beds:ri(5,20),medicine:ri(10,100)})}const ambulances=[];for(let i=0;i<AMBULANCE_COUNT;i++)ambulances.push({id:`AMB-${String(i+1).padStart(2,'0')}`,currentNode:riem(nodes).id,status:'IDLE'});return{graph,nodes,hospitals,ambulances}}
function dijkstra(start,s){const d=new Map(),p=new Map();s.nodes.forEach(n=>d.set(n.id,Infinity));d.set(start,0);const q=new MinPriorityQueue;q.enqueue(start,0);while(!q.isEmpty()){const {value:u,priority:du}=q.dequeue();if(du!==d.get(u))continue;for(const e of s.graph.get(u)||[]){if(e.blocked)continue;const nd=du+e.travelTime;if(nd<d.get(e.to)){d.set(e.to,nd);p.set(e.to,u);q.enqueue(e.to,nd)}}}return{d,p}}
function path(start,end,p){const r=[];for(let x=end;x!==undefined;x=p.get(x)){r.push(x);if(x===start)break}if(r.at(-1)!==start)return null;return r.reverse()}
function processEmergency(start,specialty,s){const log=[`Emergency received at ${start}. Required specialty: ${specialty}.`],idle=s.ambulances.filter(a=>a.status==='IDLE');if(!idle.length){log.push('All local ambulances currently occupied.');return{success:false,status:'QUEUED_NO_AMBULANCE',decisionLog:log}}const {d,p}=dijkstra(start,s);let nearest=null,nd=Infinity,best=null,bc=Infinity,bt=Infinity,bw=0;for(const h of s.hospitals){const dist=d.get(h.nodeId);if(dist<nd){nearest=h;nd=dist}const ok=h.specialty.includes(specialty)&&h.beds>0&&h.medicine>0;if(h===nearest&&!ok)log.push(`Hospital ${h.id} is closer (${dist}) but lacks required specialty/resources. Rerouting...`);if(!ok||dist===Infinity)continue;const w=h.beds<=LOW_BED_THRESHOLD?LOW_BED_WAIT_PENALTY:0,c=dist+w;if(c<bc){best=h;bc=c;bt=dist;bw=w}}if(!best){log.push(`No feasible hospital found for ${specialty}.`);return{success:false,status:'NO_FEASIBLE_HOSPITAL',decisionLog:log}}const route=path(start,best.nodeId,p);let amb=idle[0],ad=Infinity;for(const a of idle){const x=d.get(a.currentNode);if(x<ad){ad=x;amb=a}}best.beds--;best.medicine--;amb.status='DISPATCHED';log.push(`Routed to Hospital ${best.id} (Distance: ${bt}). Dispatched Ambulance ${amb.id}. Hospital ${best.id} beds remaining: ${best.beds}.`);return{success:true,hospital:best,ambulance:amb,path:route,travelTime:bt,waitPenalty:bw,compositeCost:bc,decisionLog:log}}
function createHealthcareEngine(){const state=generateMockGraph();return{...state,processEmergency:(n,s)=>processEmergency(n,s,state)}}
const engine=createHealthcareEngine();let map,routeLayer;
function updateTelemetry(){const c=document.getElementById('telemetry-container');c.innerHTML=engine.hospitals.map(h=>`<div class="card-glass p-3 telemetry-card"><div class="flex justify-between font-bold text-cyan-400"><span>${h.id}</span><span class="text-xs font-normal text-slate-400">${h.specialty[0]}</span></div><div class="flex items-center gap-2 mt-2"><span class="w-12 text-xs text-slate-400">Beds</span><div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden"><div class="bg-blue-500 h-full" style="width:${Math.min(100,h.beds/20*100)}%"></div></div><span class="text-xs w-6 text-right">${h.beds}</span></div><div class="flex items-center gap-2 mt-2"><span class="w-12 text-xs text-slate-400">Meds</span><div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden"><div class="bg-emerald-500 h-full" style="width:${Math.min(100,h.medicine)}%"></div></div><span class="text-xs w-6 text-right">${h.medicine}</span></div></div>`).join('');gsap.from('.telemetry-card',{y:10,opacity:0,duration:.3,stagger:.05})}
function log(t,type='normal'){const e=document.createElement('div');e.className=type==='error'?'text-red-400':type==='success'?'text-cyan-400':'text-slate-300';e.textContent='> '+t;const b=document.getElementById('decision-log');b.appendChild(e);b.scrollTop=b.scrollHeight;gsap.from(e,{opacity:0,x:-10,duration:.3})}
function dispatch(){const v=engine.nodes.filter(n=>n.type==='VILLAGE'),start=riem(v),spec=document.getElementById('specialty-select').value;log(`--- NEW REQUEST: ${spec} at ${start.id} ---`);const r=engine.processEmergency(start.id,spec);r.decisionLog.forEach(x=>log(x));if(r.success){log('SUCCESS: Dispatch Authorized.','success');updateTelemetry();if(routeLayer)map.removeLayer(routeLayer);const ll=r.path.map(id=>engine.nodes.find(n=>n.id===id).coordinates);routeLayer=L.polyline(ll,{color:'#06b6d4',weight:4,className:'route-glow'}).addTo(map);map.flyToBounds(routeLayer.getBounds(),{padding:[50,50],duration:1.5})}else log(`FAILURE: ${r.status}`,'error')}
document.addEventListener('DOMContentLoaded',()=>{gsap.from('.gs-header',{x:50,opacity:0,duration:.8,ease:'power3.out'});gsap.from('.gs-controls',{x:50,opacity:0,duration:.8,delay:.2,ease:'power3.out'});map=L.map('map',{zoomControl:false}).setView([19,73],10);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; CartoDB',subdomains:'abcd',maxZoom:19}).addTo(map);engine.nodes.forEach(n=>{if(n.type!=='HOSPITAL')L.circleMarker(n.coordinates,{radius:2,color:'#334155',fillOpacity:.8,stroke:false}).addTo(map)});engine.hospitals.forEach(h=>L.circleMarker(h.coordinates,{radius:10,color:'#0ea5e9',fillColor:'#0284c7',fillOpacity:.8,weight:2}).addTo(map).bindTooltip(`<b>${h.id}</b><br>${h.specialty.join(', ')}`,{direction:'top'}));updateTelemetry();document.getElementById('btn-trigger').addEventListener('click',dispatch)})
</script></body></html>
