<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MED-ROUTE // Emergency Command</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script><style>:root{--c:#22d3ee;--bg:#020617;--panel:rgba(2,8,23,.76)}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#e2e8f0;font-family:Inter,ui-sans-serif,system-ui}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.glass{background:var(--panel);backdrop-filter:blur(22px);border:1px solid rgba(148,163,184,.12);box-shadow:0 25px 90px rgba(0,0,0,.35)}.hair{border-color:rgba(148,163,184,.1)}.leaflet-container{background:#020617}.leaflet-control-attribution{background:rgba(2,8,23,.7)!important;color:#64748b!important}.leaflet-control-attribution a{color:#94a3b8!important}.scan{background:linear-gradient(90deg,transparent,rgba(34,211,238,.2),transparent);animation:scan 3s linear infinite}@keyframes scan{to{transform:translateX(100%)}}.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(34,211,238,.04),0 0 30px rgba(34,211,238,.3)}}.dispatch{background:linear-gradient(110deg,#0891b2,#2563eb,#0891b2);background-size:220%;animation:flow 3s linear infinite;box-shadow:0 0 25px rgba(34,211,238,.18)}@keyframes flow{to{background-position:220%}}.route{filter:drop-shadow(0 0 8px rgba(34,211,238,.95));stroke-dasharray:12 8;animation:route .65s linear infinite}@keyframes route{to{stroke-dashoffset:-20}}.hmark{background:#0ea5e9;border:2px solid #a5f3fc;border-radius:50%;box-shadow:0 0 0 5px rgba(14,165,233,.12),0 0 24px rgba(34,211,238,.7)}.amark{background:#f43f5e;border:2px solid #fecdd3;border-radius:50%;box-shadow:0 0 18px rgba(244,63,94,.8)}.no-scroll::-webkit-scrollbar{display:none}.no-scroll{scrollbar-width:none}.logline{border-left:2px solid rgba(34,211,238,.35);padding-left:9px}.warn{border-color:#f59e0b}.success{border-color:#22d3ee}</style></head><body><div id="map" class="absolute inset-0"></div><div class="absolute inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_top_right,rgba(8,47,73,.3),transparent_46%)]"></div><div id="top" class="absolute top-4 left-4 right-4 z-[1000] flex justify-between pointer-events-none"><div class="glass rounded-2xl px-4 py-3 pointer-events-auto"><div class="flex gap-3 items-center"><div class="w-2.5 h-2.5 rounded-full bg-cyan-300 pulse"></div><div><div class="mono text-[11px] tracking-[.28em] text-cyan-300">MED-ROUTE // LIVE</div><div class="text-[10px] text-slate-500">RURAL EMERGENCY DISPATCH NETWORK</div></div></div></div><div class="glass rounded-2xl px-4 py-3 text-right pointer-events-auto"><div class="mono text-[9px] text-slate-500 tracking-widest">ENGINE STATUS</div><div class="text-sm font-semibold text-emerald-300 mt-1">● ONLINE / DIJKSTRA</div></div></div><aside id="panel" class="absolute top-20 right-4 bottom-4 z-[1000] w-[410px] max-w-[calc(100vw-32px)] glass rounded-3xl flex flex-col overflow-hidden"><header class="p-5 border-b hair relative"><div class="absolute left-0 right-0 bottom-0 h-px scan"></div><div class="flex justify-between"><div><div class="mono text-[9px] tracking-[.25em] text-slate-500">OPERATIONS / 01</div><h1 class="text-xl font-semibold mt-1">Emergency Command</h1></div><span id="mode" class="mono text-[9px] px-2 py-1 rounded-full bg-emerald-400/10 text-emerald-300">READY</span></div></header><section class="p-4 border-b hair"><div class="mono text-[9px] tracking-widest text-slate-500 mb-2">INCOMING REQUEST</div><div class="grid grid-cols-[1fr_auto] gap-2"><select id="specialty" class="bg-slate-950/80 border border-slate-700/70 rounded-xl px-3 py-3 text-sm outline-none"><option>Cardiology</option><option>Trauma</option><option>Neurology</option><option>Pediatrics</option></select><button id="dispatch" class="dispatch rounded-xl px-4 text-xs font-bold tracking-wider">DISPATCH</button></div><div class="flex justify-between mt-3 mono text-[9px] text-slate-500"><span>ORIGIN <b id="origin" class="text-slate-300">AUTO</b></span><span>PRIORITY <b class="text-rose-300">CRITICAL</b></span></div></section><section class="px-4 pt-4"><div class="flex justify-between"><span class="mono text-[9px] tracking-widest text-slate-500">HOSPITAL CAPACITY</span><span class="mono text-[9px] text-slate-600">5 FACILITIES</span></div><div id="hospitals" class="mt-2 space-y-2 max-h-[180px] overflow-auto no-scroll"></div></section><section class="px-4 pt-4"><div class="flex justify-between"><span class="mono text-[9px] tracking-widest text-slate-500">AMBULANCE FLEET</span><span id="fleetCount" class="mono text-[9px] text-emerald-300">10 IDLE</span></div><div id="fleet" class="mt-2 grid grid-cols-5 gap-1"></div></section><section class="px-4 pt-4 min-h-0 flex-1 flex flex-col"><div class="flex justify-between"><span class="mono text-[9px] tracking-widest text-slate-500">DECISION TIMELINE</span><button id="clear" class="mono text-[9px] text-slate-600">CLEAR</button></div><div id="log" class="mt-2 flex-1 overflow-auto no-scroll rounded-2xl bg-black/15 border hair p-3 space-y-2 text-[10px] mono"></div></section><section class="px-4 pt-3 pb-4"><div class="grid grid-cols-2 gap-2"><button id="closure" class="rounded-xl border border-amber-400/20 bg-amber-400/[.04] px-3 py-2 text-[10px] mono text-amber-300 hover:bg-amber-400/10">SIMULATE ROAD CLOSURE</button><button id="resetFleet" class="rounded-xl border border-white/10 bg-white/[.03] px-3 py-2 text-[10px] mono text-slate-400 hover:text-white">RESET FLEET</button></div><div id="result" class="mt-2 rounded-2xl border border-cyan-300/10 bg-cyan-300/[.03] p-3 hidden"></div><div class="grid grid-cols-3 gap-2 mt-2"><div class="rounded-xl bg-white/[.025] border hair p-2"><div class="mono text-[8px] text-slate-600">NODES</div><b>500</b></div><div class="rounded-xl bg-white/[.025] border hair p-2"><div class="mono text-[8px] text-slate-600">EDGES</div><b id="edgeCount">~1.5K</b></div><div class="rounded-xl bg-white/[.025] border hair p-2"><div class="mono text-[8px] text-slate-600">COST</div><b>O((V+E)logV)</b></div></div></section></aside><div id="toast" class="absolute bottom-6 left-6 z-[1100] glass rounded-2xl px-4 py-3 hidden"><div id="tt" class="mono text-[9px] text-cyan-300 tracking-widest"></div><div id="tx" class="text-xs text-slate-300 mt-1"></div></div><script src="./core-engine.js"></script><script>
const engine=createHealthcareEngine(),$=x=>document.getElementById(x),villages=engine.nodes.filter(n=>n.type==='VILLAGE');let map,route,origin,ambulanceMarker,closureEdges=[];
function edgeTotal(){let n=0;engine.graph.forEach(a=>n+=a.length);return Math.floor(n/2)}
function mapInit(){map=L.map('map',{preferCanvas:true,zoomControl:false}).setView([19,73],10);L.control.zoom({position:'bottomleft'}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);engine.nodes.forEach(n=>{if(n.type==='VILLAGE')L.circleMarker(n.coordinates,{radius:2.3,color:'#475569',fillOpacity:.5,weight:0}).addTo(map)});engine.hospitals.forEach(h=>{const icon=L.divIcon({className:'',html:'<div class="hmark w-4 h-4"></div>',iconSize:[16,16],iconAnchor:[8,8]});L.marker(h.coordinates,{icon}).addTo(map).bindPopup(`<div class="mono text-[11px]"><b>${h.id}</b><br>${h.specialty.join(' · ')}<br>BEDS ${h.beds} · MEDICINE ${h.medicine}</div>`)})}
function renderHospitals(){ $('hospitals').innerHTML=engine.hospitals.map(h=>{let bp=Math.min(100,h.beds/20*100),mp=Math.min(100,h.medicine);return `<div data-h="${h.id}" class="rounded-xl border hair bg-white/[.02] p-3"><div class="flex justify-between"><b class="mono text-[10px]">${h.id}</b><span class="mono text-[8px] text-slate-500">${h.specialty.join(' · ')}</span></div><div class="grid grid-cols-2 gap-3 mt-2"><div><div class="flex justify-between mono text-[8px] text-slate-500">BEDS <b class="bed">${h.beds}</b></div><div class="h-1 bg-slate-800 rounded mt-1"><i class="block h-full bg-cyan-400 rounded" style="width:${bp}%"></i></div></div><div><div class="flex justify-between mono text-[8px] text-slate-500">MEDS <b class="med">${h.medicine}</b></div><div class="h-1 bg-slate-800 rounded mt-1"><i class="block h-full bg-blue-400 rounded" style="width:${mp}%"></i></div></div></div></div>`}).join('')}
function renderFleet(){let idle=engine.ambulances.filter(a=>a.status==='IDLE').length;$('fleetCount').textContent=`${idle} IDLE / ${10-idle} ACTIVE`;$('fleet').innerHTML=engine.ambulances.map(a=>`<div title="${a.id}" class="h-2.5 rounded-sm ${a.status==='IDLE'?'bg-slate-600':'bg-rose-400'} ${a.status==='DISPATCHED'?'pulse':''}"></div>`).join('')}
function log(t,k=''){let e=document.createElement('div');e.className='logline '+k;e.textContent='> '+t;$('log').appendChild(e);$('log').scrollTop=$('log').scrollHeight;gsap.from(e,{x:12,opacity:0,duration:.3})}
function toast(a,b){$('tt').textContent=a;$('tx').textContent=b;$('toast').classList.remove('hidden');gsap.fromTo('#toast',{y:15,opacity:0},{y:0,opacity:1,duration:.3});gsap.to('#toast',{y:10,opacity:0,delay:3,duration:.35,onComplete:()=> $('toast').classList.add('hidden')})}
function animateHospital(h){let c=document.querySelector(`[data-h="${h.id}"]`);if(!c)return;gsap.fromTo(c,{backgroundColor:'rgba(34,211,238,.14)',scale:1.02},{backgroundColor:'rgba(255,255,255,.02)',scale:1,duration:1});gsap.fromTo(c.querySelector('.bed'),{scale:1.7,color:'#67e8f9'},{scale:1,color:'#cbd5e1',duration:.6});gsap.fromTo(c.querySelector('.med'),{scale:1.7,color:'#67e8f9'},{scale:1,color:'#cbd5e1',duration:.6})}
function moveAmbulance(coords,ambulance){if(ambulanceMarker)map.removeLayer(ambulanceMarker);const icon=L.divIcon({className:'',html:'<div class="amark w-3 h-3"></div>',iconSize:[12,12],iconAnchor:[6,6]});ambulanceMarker=L.marker(coords[0],{icon,zIndexOffset:900}).addTo(map);let o={i:0};gsap.to(o,{i:coords.length-1,duration:Math.min(8,Math.max(2,coords.length*.12)),ease:'none',onUpdate:()=>ambulanceMarker.setLatLng(coords[Math.floor(o.i)]),onComplete:()=>{ambulanceMarker.bindTooltip(`${ambulance.id} // ARRIVED`,{permanent:true,direction:'top'}).openTooltip()}})}
function dispatch(){let b=$('dispatch');if(b.disabled)return;b.disabled=true;b.textContent='ROUTING…';$('mode').textContent='COMPUTING';const start=villages[Math.floor(Math.random()*villages.length)],sp=$('specialty').value;$('origin').textContent=start.id;log(`REQUEST // ${sp} // ORIGIN ${start.id}`);if(origin)map.removeLayer(origin);origin=L.circleMarker(start.coordinates,{radius:8,color:'#67e8f9',fillColor:'#22d3ee',fillOpacity:.15,weight:2}).addTo(map);setTimeout(()=>{log('DIJKSTRA // binary min heap active');let before=engine.hospitals.map(h=>({id:h.id,b:h.beds,m:h.medicine}));let r=engine.processEmergency(start.id,sp);r.decisionLog.forEach(x=>log(x,/rejected|infeasible|0 beds|0 medicine/.test(x)?'warn':''));if(r.success){$('mode').textContent='DISPATCHED';log(`ROUTE LOCKED // ${r.path.length} nodes // COST ${r.compositeCost}`,'success');log(`${r.ambulance.id} // EN ROUTE`,'success');if(route)map.removeLayer(route);let coords=r.path.map(id=>engine.nodes.find(n=>n.id===id).coordinates);route=L.polyline(coords,{color:'#22d3ee',weight:4,className:'route'}).addTo(map);map.flyToBounds(route.getBounds(),{padding:[120,120],duration:1.2});moveAmbulance(coords,r.ambulance);renderHospitals();renderFleet();animateHospital(r.hospital);$('result').classList.remove('hidden');$('result').innerHTML=`<div class="mono text-[9px] tracking-widest text-cyan-300">MISSION COMPLETE</div><div class="flex justify-between mt-2"><b>${r.ambulance.id} → ${r.hospital.id}</b><b class="text-cyan-300">${r.compositeCost}</b></div><div class="mono text-[8px] text-slate-500 mt-1">TRAVEL ${r.travelTime} · WAIT PENALTY ${r.waitPenalty} · BEDS ${r.hospital.beds} · MEDS ${r.hospital.medicine}</div>`;toast('DISPATCH AUTHORIZED',`${r.ambulance.id} routed to ${r.hospital.id}`)}else{$('mode').textContent=r.status||'FAILED';log(`REQUEST FAILED // ${r.status}`,'warn');toast('REQUEST NOT COMPLETED',r.reason||r.status);renderFleet()}b.disabled=false;b.textContent='DISPATCH'},300)}
function simulateClosure(){let candidates=[];engine.graph.forEach((edges,from)=>edges.forEach(e=>{if(from<e.to&&!e.blocked)candidates.push([from,e.to])}));let pair=candidates[Math.floor(Math.random()*candidates.length)];if(!pair)return;engine.setRoadBlocked(pair[0],pair[1],true);closureEdges.push(pair);log(`ROAD CLOSURE // ${pair[0]} ↔ ${pair[1]} // EDGE BLOCKED`,'warn');$('mode').textContent='REROUTING';toast('ROAD NETWORK CHANGED',`${pair[0]} ↔ ${pair[1]} is now unavailable`);gsap.fromTo('#mode',{scale:1.2,color:'#fbbf24'},{scale:1,color:'#fbbf24',duration:.5})}
$('dispatch').onclick=dispatch;$('closure').onclick=simulateClosure;$('clear').onclick=()=>{$('log').innerHTML='';log('SYSTEM // timeline cleared')};$('resetFleet').onclick=()=>{engine.ambulances.forEach(a=>a.status='IDLE');renderFleet();$('mode').textContent='READY';log('FLEET // all ambulances returned to IDLE')};mapInit();renderHospitals();renderFleet();$('edgeCount').textContent=edgeTotal().toLocaleString();log('SYSTEM ONLINE // 500 graph nodes loaded');log('READY // awaiting emergency payload');gsap.from('#top',{y:-20,opacity:0,duration:.7});gsap.from('#panel',{x:40,opacity:0,duration:.8,delay:.15});
</script></body></html>
