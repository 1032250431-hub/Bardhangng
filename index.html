<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MED-ROUTE // Rural Emergency Command</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
:root{--cyan:#22d3ee;--blue:#38bdf8;--ink:#020617;--panel:rgba(2,8,23,.72)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:#e2e8f0;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.leaflet-container{background:#020617}.leaflet-control-attribution{background:rgba(2,8,23,.7)!important;color:#64748b!important}.leaflet-control-attribution a{color:#94a3b8!important}.glass{background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(148,163,184,.12);box-shadow:0 24px 80px rgba(0,0,0,.3)}.hairline{border-color:rgba(148,163,184,.11)}.scan{background:linear-gradient(90deg,transparent,rgba(34,211,238,.18),transparent);animation:scan 3s linear infinite}@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(34,211,238,.04),0 0 30px rgba(34,211,238,.25)}}.dispatch-btn{background:linear-gradient(110deg,#0891b2,#2563eb,#0891b2);background-size:220% 100%;animation:flow 3s linear infinite;box-shadow:0 0 28px rgba(34,211,238,.18)}@keyframes flow{to{background-position:220% 0}}.route{filter:drop-shadow(0 0 7px rgba(34,211,238,.9));stroke-dasharray:12 8;animation:routeFlow .65s linear infinite}@keyframes routeFlow{to{stroke-dashoffset:-20}}.marker-h{background:#0ea5e9;border:2px solid #a5f3fc;border-radius:50%;box-shadow:0 0 0 5px rgba(14,165,233,.12),0 0 24px rgba(34,211,238,.7)}.marker-a{background:#f43f5e;border:2px solid #fecdd3;border-radius:50%;box-shadow:0 0 18px rgba(244,63,94,.8)}.metric{font-variant-numeric:tabular-nums}.low{color:#fbbf24}.critical{color:#fb7185}.logline{border-left:2px solid rgba(34,211,238,.35);padding-left:9px}.logline.warn{border-color:#f59e0b}.logline.success{border-color:#22d3ee}.no-scroll::-webkit-scrollbar{display:none}.no-scroll{scrollbar-width:none}
</style>
</head>
<body>
<div id="map" class="absolute inset-0"></div>
<div class="absolute inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_top_right,rgba(8,47,73,.28),transparent_45%)]"></div>
<div id="topbar" class="absolute top-4 left-4 right-4 z-[1000] flex items-start justify-between pointer-events-none">
  <div class="glass rounded-2xl px-4 py-3 pointer-events-auto"><div class="flex items-center gap-3"><div class="w-2.5 h-2.5 rounded-full bg-cyan-300 pulse"></div><div><div class="mono text-[11px] tracking-[.28em] text-cyan-300">MED-ROUTE // LIVE</div><div class="text-[10px] text-slate-500 mt-0.5">RURAL EMERGENCY DISPATCH NETWORK</div></div></div></div>
  <div class="glass rounded-2xl px-4 py-3 pointer-events-auto text-right"><div class="mono text-[10px] text-slate-500 tracking-widest">ENGINE STATUS</div><div class="text-sm font-semibold text-emerald-300 mt-1">● ONLINE <span class="text-slate-600 mx-1">/</span> DIJKSTRA</div></div>
</div>
<div id="command" class="absolute top-20 right-4 bottom-4 z-[1000] w-[390px] max-w-[calc(100vw-32px)] glass rounded-3xl flex flex-col overflow-hidden">
 <div class="p-5 border-b hairline relative overflow-hidden"><div class="absolute inset-x-0 bottom-0 h-px scan"></div><div class="flex items-start justify-between"><div><div class="mono text-[9px] tracking-[.25em] text-slate-500">OPERATIONS / 01</div><h1 class="text-xl font-semibold tracking-tight mt-1">Emergency Command</h1></div><div id="mode" class="mono text-[9px] px-2 py-1 rounded-full bg-emerald-400/10 text-emerald-300 border border-emerald-300/10">READY</div></div></div>
 <div class="p-4 border-b hairline"><div class="mono text-[9px] tracking-widest text-slate-500 mb-2">INCOMING REQUEST</div><div class="grid grid-cols-[1fr_auto] gap-2"><select id="specialty" class="bg-slate-950/70 border border-slate-700/70 rounded-xl px-3 py-3 text-sm outline-none focus:border-cyan-400/50"><option>Cardiology</option><option>Trauma</option><option>Neurology</option><option>Pediatrics</option></select><button id="dispatch" class="dispatch-btn rounded-xl px-4 text-xs font-bold tracking-wider">DISPATCH</button></div><div class="flex justify-between mt-3 text-[10px] mono text-slate-500"><span>ORIGIN <b id="origin" class="text-slate-300">AUTO SELECT</b></span><span>PRIORITY <b class="text-rose-300">CRITICAL</b></span></div></div>
 <div class="px-4 pt-4"><div class="flex items-center justify-between"><span class="mono text-[9px] tracking-widest text-slate-500">HOSPITAL CAPACITY</span><span class="mono text-[9px] text-slate-600">5 FACILITIES</span></div><div id="hospitals" class="mt-2 space-y-2 max-h-[190px] overflow-auto no-scroll"></div></div>
 <div class="px-4 pt-4 min-h-0 flex-1 flex flex-col"><div class="flex items-center justify-between"><span class="mono text-[9px] tracking-widest text-slate-500">DECISION TIMELINE</span><button id="clearLog" class="mono text-[9px] text-slate-600 hover:text-slate-300">CLEAR</button></div><div id="log" class="mt-2 flex-1 overflow-auto no-scroll rounded-2xl bg-black/15 border hairline p-3 space-y-2 text-[10px] mono"></div></div>
 <div id="result" class="m-4 mt-3 rounded-2xl border border-cyan-300/10 bg-cyan-300/[.03] p-3 hidden"></div>
 <div class="px-4 pb-4 pt-1 grid grid-cols-3 gap-2"><div class="rounded-xl bg-white/[.025] border hairline p-2"><div class="mono text-[8px] text-slate-600">NODES</div><div class="metric text-sm font-semibold mt-1">500</div></div><div class="rounded-xl bg-white/[.025] border hairline p-2"><div class="mono text-[8px] text-slate-600">EDGES</div><div class="metric text-sm font-semibold mt-1">1,497+</div></div><div class="rounded-xl bg-white/[.025] border hairline p-2"><div class="mono text-[8px] text-slate-600">COMPLEXITY</div><div class="metric text-sm font-semibold mt-1">O((V+E)logV)</div></div></div>
</div>
<div id="toast" class="absolute bottom-6 left-6 z-[1100] glass rounded-2xl px-4 py-3 hidden pointer-events-none"><div id="toastTitle" class="mono text-[9px] text-cyan-300 tracking-widest"></div><div id="toastText" class="text-xs text-slate-300 mt-1"></div></div>
<script src="./core-engine.js"></script>
<script>
const engine=createHealthcareEngine();let map,routeLayer,originLayer,ambulanceLayer;const $=id=>document.getElementById(id);const villages=engine.nodes.filter(n=>n.type==='VILLAGE');
function initMap(){map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([19,73],10);L.control.zoom({position:'bottomleft'}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);engine.nodes.forEach(n=>{if(n.type==='VILLAGE')L.circleMarker(n.coordinates,{radius:2.5,color:'#475569',fillColor:'#94a3b8',fillOpacity:.5,weight:0}).addTo(map)});engine.hospitals.forEach(h=>{const icon=L.divIcon({className:'',html:'<div class="marker-h w-4 h-4"></div>',iconSize:[16,16],iconAnchor:[8,8]});L.marker(h.coordinates,{icon}).addTo(map).bindPopup(`<div class="mono text-[11px]"><b>${h.id}</b><br><span class="text-slate-400">${h.specialty.join(' · ')}</span><br>BEDS ${h.beds} · MEDICINE ${h.medicine}</div>`)})}
function renderHospitals(){const wrap=$('hospitals');wrap.innerHTML=engine.hospitals.map(h=>{const bedPct=Math.min(100,h.beds/20*100),medPct=Math.min(100,h.medicine/100*100);return `<div data-hospital="${h.id}" class="hospital rounded-xl border hairline bg-white/[.02] p-3"><div class="flex justify-between items-center"><div class="mono text-[10px] font-semibold text-slate-200">${h.id}</div><div class="mono text-[8px] text-slate-500">${h.specialty.join(' · ')}</div></div><div class="grid grid-cols-2 gap-3 mt-2"><div><div class="flex justify-between mono text-[8px] text-slate-500"><span>BEDS</span><b class="bedval text-slate-300">${h.beds}</b></div><div class="h-1 bg-slate-800 rounded-full mt-1 overflow-hidden"><div class="bedbar h-full bg-cyan-400" style="width:${bedPct}%"></div></div></div><div><div class="flex justify-between mono text-[8px] text-slate-500"><span>MEDICINE</span><b class="medval text-slate-300">${h.medicine}</b></div><div class="h-1 bg-slate-800 rounded-full mt-1 overflow-hidden"><div class="medbar h-full bg-blue-400" style="width:${medPct}%"></div></div></div></div></div>`}).join('')}
function writeLog(text,kind=''){const e=document.createElement('div');e.className=`logline ${kind}`;e.textContent=text;const l=$('log');l.appendChild(e);l.scrollTop=l.scrollHeight;gsap.from(e,{x:14,opacity:0,duration:.35,ease:'power2.out'})}
function showToast(title,text){$('toastTitle').textContent=title;$('toastText').textContent=text;$('toast').classList.remove('hidden');gsap.fromTo('#toast',{y:20,opacity:0},{y:0,opacity:1,duration:.35});gsap.to('#toast',{opacity:0,y:10,delay:3,duration:.35,onComplete:()=>$('toast').classList.add('hidden')})}
function animateResource(h,beforeBeds,beforeMed){const card=document.querySelector(`[data-hospital="${h.id}"]`);if(!card)return;const bv=card.querySelector('.bedval'),mv=card.querySelector('.medval');gsap.fromTo(bv,{scale:1.5,color:'#67e8f9'},{scale:1,color:'#cbd5e1',duration:.7});gsap.fromTo(mv,{scale:1.5,color:'#67e8f9'},{scale:1,color:'#cbd5e1',duration:.7});gsap.fromTo(card,{backgroundColor:'rgba(34,211,238,.12)'},{backgroundColor:'rgba(255,255,255,.02)',duration:1.2});}
function dispatch(){const btn=$('dispatch');if(btn.disabled)return;btn.disabled=true;btn.textContent='ROUTING…';$('mode').textContent='COMPUTING';$('mode').className='mono text-[9px] px-2 py-1 rounded-full bg-amber-400/10 text-amber-300 border border-amber-300/10';const start=villages[Math.floor(Math.random()*villages.length)],specialty=$('specialty').value;$('origin').textContent=start.id;writeLog(`REQUEST // ${specialty} // ORIGIN ${start.id}`);if(originLayer)map.removeLayer(originLayer);originLayer=L.circleMarker(start.coordinates,{radius:7,color:'#67e8f9',fillColor:'#22d3ee',fillOpacity:.18,weight:2}).addTo(map);gsap.to(originLayer.getElement(),{opacity:.35,repeat:5,yoyo:true,duration:.35});setTimeout(()=>{const before=engine.hospitals.map(h=>({id:h.id,beds:h.beds,medicine:h.medicine}));writeLog('ROUTING ENGINE // Dijkstra + Binary Min Heap');const r=engine.processEmergency(start.id,specialty);r.decisionLog.forEach(x=>writeLog(x,x.includes('rejected')||x.includes('infeasible')?'warn':''));if(r.success){$('mode').textContent='DISPATCHED';$('mode').className='mono text-[9px] px-2 py-1 rounded-full bg-cyan-400/10 text-cyan-300 border border-cyan-300/10';writeLog(`ROUTE LOCKED // ${r.path.length} nodes // COST ${r.compositeCost}`,'success');writeLog(`AMBULANCE ${r.ambulance.id} // EN ROUTE`,'success');if(routeLayer)map.removeLayer(routeLayer);const coords=r.path.map(id=>engine.nodes.find(n=>n.id===id).coordinates);routeLayer=L.polyline(coords,{color:'#22d3ee',weight:4,opacity:.95,className:'route'}).addTo(map);map.flyToBounds(routeLayer.getBounds(),{padding:[100,100],duration:1.25});renderHospitals();const b=before.find(x=>x.id===r.hospital.id);animateResource(r.hospital,b.beds,b.medicine);$('result').classList.remove('hidden');$('result').innerHTML=`<div class="mono text-[9px] tracking-widest text-cyan-300">MISSION COMPLETE</div><div class="flex items-end justify-between mt-2"><div><div class="text-sm font-semibold">${r.ambulance.id} → ${r.hospital.id}</div><div class="mono text-[9px] text-slate-500 mt-1">${r.travelTime} TRAVEL · ${r.waitPenalty} WAIT PENALTY</div></div><div class="text-right"><div class="mono text-lg font-bold text-cyan-300">${r.compositeCost}</div><div class="mono text-[8px] text-slate-600">COMPOSITE COST</div></div></div>`;showToast('DISPATCH AUTHORIZED',`${r.ambulance.id} routed to ${r.hospital.id}`)}else{$('mode').textContent=r.status||'QUEUED';$('mode').className='mono text-[9px] px-2 py-1 rounded-full bg-rose-400/10 text-rose-300 border border-rose-300/10';writeLog(`REQUEST FAILED // ${r.status}`,'warn');showToast('DISPATCH NOT COMPLETED',r.reason||r.status)}btn.disabled=false;btn.textContent='DISPATCH'},260)}
$('clearLog').onclick=()=>{$('log').innerHTML='';writeLog('SYSTEM // decision timeline cleared')};$('dispatch').onclick=dispatch;initMap();renderHospitals();writeLog('SYSTEM ONLINE // 500 graph nodes loaded');writeLog('READY // awaiting emergency payload');gsap.from('#topbar',{y:-20,opacity:0,duration:.7,ease:'power3.out'});gsap.from('#command',{x:40,opacity:0,duration:.8,delay:.15,ease:'power3.out'});
</script>
</body></html>
